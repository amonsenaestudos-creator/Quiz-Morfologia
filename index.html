<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | Morfologia</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="2232688.png" type="image/x-icon">
</head>
<body>

  <div class="quiz-container">
    <div id="welcome-box" class="card-box">
      <!-- <div class="mascot">📚</div> -->
      <h1>Quiz de Morfologia</h1>
      <p class="subtitle">Mostre o quanto você sabe sobre a estrutura das palavras!</p>
      
      <form id="start-form">
        <label for="username-input">Para começar, digite seu nome</label>
        <input 
          type="text" 
          id="username-input" 
          placeholder="Digite seu nome ou apelido..." 
          required 
          autocomplete="off"
        />
        <button type="submit" class="btn-action btn-start">Começar Quiz!</button>
      </form>
    </div>

    <div id="quiz-box" class="card-box hide">
      <div class="header-info">
        <div class="user-header">
          <span>Estudante(a): <strong id="display-username"></strong> ⭐</span>
        </div>
        <div id="timer-box" class="timer-badge">
          ⏳ <span id="timer-text">15</span>s
        </div>
      </div>

      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <h2 id="question">Pergunta aqui...</h2>
      
      <div id="options" class="options-container">
      </div>

      <div id="feedback-text" class="feedback-text hide"></div>

      <button id="next-btn" class="btn-action btn-next hide">Próxima Pergunta ➡️</button>
    </div>

    <div id="result-box" class="card-box hide">
      <div class="result-badge">
        <div id="result-icon" class="mascot-result">🏆</div>
      </div>
      
      <h1 id="result-title">Resultado Final</h1>
      
      <div id="score-details" class="score-grid">
        <div class="stat-card">
          <span class="stat-label">Acertos</span>
          <span id="correct-count" class="stat-value correct-color">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Erros</span>
          <span id="wrong-count" class="stat-value wrong-color">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Desempenho</span>
          <span id="percentage-score" class="stat-value percent-color">0%</span>
        </div>
      </div>

      <p id="score" class="score-text"></p>
      
      <button id="restart-btn" class="btn-action btn-restart">🔄 Jogar De Novo!</button>

      <p class="credits">Feito por: Ancelmo, Heitor e Amon</p>

    </div>

  </div>

  <img src="IFBA.png" alt="Logo IFBA" class="ifba-logo">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
